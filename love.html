<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เรื่องของเธอ</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Prompt:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f3;--card:#ffffff;--text:#3b2a2e;--muted:#8a6f75;--accent:#e8678a;--chip:#ffe3ea;--line:#f3d4db;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1418;--card:#2a1d22;--text:#f6e6ea;--muted:#b99aa3;--accent:#ff86a6;--chip:#3d2630;--line:#4a2f3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1418;--card:#2a1d22;--text:#f6e6ea;--muted:#b99aa3;--accent:#ff86a6;--chip:#3d2630;--line:#4a2f3a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Prompt',system-ui,sans-serif;line-height:1.7}
main{max-width:560px;margin:0 auto;padding:32px 20px 64px}
h1,h2{font-family:'Mitr','Prompt',sans-serif;font-weight:500}
h1{font-size:2rem;margin:.2em 0}
h2{font-size:1.25rem;margin:2.2em 0 .8em;color:var(--accent)}
.hero{text-align:center;padding:24px 0 8px}
.hero p{color:var(--muted);margin:0}
.emoji{font-size:2.6rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.card small{color:var(--muted);display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border-radius:999px;padding:6px 14px;font-size:.95rem}
.song{display:flex;gap:12px;align-items:center}
.song .n{width:34px;height:34px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--accent);flex:none}
.song small{margin:0}
.end{text-align:center;margin-top:2.4em}
button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 26px;cursor:pointer}
#reply{margin-top:16px;color:var(--accent);min-height:1.6em}
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="emoji">💌</div>
    <h1 id="title"></h1>
    <p id="sub"></p>
  </header>

  <h2>เรื่องที่เราเคยคุยกัน</h2>
  <div id="stories"></div>

  <h2>คำพูดที่พูดบ่อย</h2>
  <div class="chips" id="jokes"></div>

  <h2>เพลงที่เธอชอบ</h2>
  <div id="songs"></div>

  <div class="end">
    <p id="closing"></p>
    <button id="btn"></button>
    <div id="reply"></div>
  </div>
</main>

<script>
// ===== แก้ข้อมูลตรงนี้ให้เป็นเรื่องจริงของคุณสองคน =====
var DATA = {
  title: "เรื่องของเเซนดี้",
  sub: "เก็บเรื่องเล็กๆ ที่เราคุยกัน ไว้ตรงนี้",
  stories: [
    {date: "วันแรกที่คุยกัน", text: "[วันนั้นไปห้องสมุดกับเพื่อนเเล้วเจอเค้านั่งอ่านหนังสืออยู่เเล้วเห็นว่าน่ารักดีก็เลยให้เพื่อนไปขอไอจี]"},
    {date: "ความชอบของเเซนดี้...", text: "[เเซนดี้ไม่ชอบกินผัก ชอบสัตว์เป็นที่สุด รักการนอน ต็อบเเต็บ]"},
    {date: "ครั้งที่หัวเราะด้วยกัน", text: "[ช่วงที่ส่งรูปเสี่ยชิโร้ให้ดูชอบบลูลี่นาง5555]"}
  ],
  jokes: ["[miss you]", "[นอนอืด]", "[ไปมอก่อนนะ]"],
  songs: [
    {name: "[ชื่อเพลง 1]", by: "[ศิลปิน]", note: "ฟังแล้วนึกถึงตอนที่เธอเล่าว่า..."},
    {name: "[ชื่อเพลง 2]", by: "[ศิลปิน]", note: "เพลงที่เธอบอกว่าฟังบ่อยสุด"}
  ],
  closing: "ขอบคุณที่ทำให้แต่ละวันสบายใจขึ้นนะ",
  button: "กดเพื่ออ่านข้อความสุดท้าย",
  reply: "อยากคุยกับเธอแบบนี้ไปอีกนานๆเลย(เป็นเเฟนก็ได้นะ) 🙂"
};
// ======================================================
function el(tag, cls, html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.textContent=html;return e}
document.getElementById('title').textContent=DATA.title;
document.getElementById('sub').textContent=DATA.sub;
document.getElementById('closing').textContent=DATA.closing;
var b=document.getElementById('btn');b.textContent=DATA.button;
b.onclick=function(){document.getElementById('reply').textContent=DATA.reply};
var s=document.getElementById('stories');
DATA.stories.forEach(function(x){var c=el('div','card');c.appendChild(el('small','',x.date));c.appendChild(el('span','',x.text));s.appendChild(c)});
var j=document.getElementById('jokes');
DATA.jokes.forEach(function(x){j.appendChild(el('span','chip',x))});
var g=document.getElementById('songs');
DATA.songs.forEach(function(x,i){var c=el('div','card song');c.appendChild(el('div','n',String(i+1)));var d=el('div');d.appendChild(el('strong','',x.name+' · '+x.by));d.appendChild(el('small','',x.note));c.appendChild(d);g.appendChild(c)});
</script>
</body>
</html>
